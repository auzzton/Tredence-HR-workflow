[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tredence-backend"
version = "0.1.0"
description = "HR Workflow Designer — FastAPI backend"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "coverage[toml]>=7.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "seed"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "tests", "seed"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "B008", # do not perform function calls in default args (needed for FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # allow assert in tests
"alembic/**" = ["I"]  # alembic templates use specific import ordering

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "pythonjsonlogger.*",
    "gunicorn.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["alembic/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
