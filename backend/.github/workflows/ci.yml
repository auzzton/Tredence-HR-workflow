name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref so a fast-follow push doesn't
# waste minutes running a stale build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Job 1 — Lint & format
  # -------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff check (linting)
        run: ruff check .

      - name: ruff format (check only — no writes)
        run: ruff format --check .

  # -------------------------------------------------------------------------
  # Job 2 — Static type checking
  # -------------------------------------------------------------------------
  typecheck:
    name: Type Check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: mypy --strict
        run: mypy --strict app/

  # -------------------------------------------------------------------------
  # Job 3 — Tests
  # Spins up a real Postgres 16 instance as a service container so tests hit
  # an actual database, matching the production behaviour.
  # -------------------------------------------------------------------------
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tredence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # asyncpg URL — same driver the app uses at runtime.
      # ALEMBIC_DATABASE_URL is intentionally unset; alembic/env.py falls back
      # to DATABASE_URL automatically.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tredence_test
      ENV: test
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Apply migrations
        # alembic reads DATABASE_URL from the environment via alembic/env.py.
        # Running this before pytest ensures the schema exists when fixtures run.
        run: alembic upgrade head

      - name: Run tests with coverage
        # pyproject.toml [tool.coverage.report] sets fail_under = 60 so this
        # step fails if overall coverage drops below that threshold.
        run: pytest --cov=app --cov-report=term-missing -v
