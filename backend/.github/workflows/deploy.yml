name: Deploy

# Fires only after the CI workflow completes on main — never deploys a build
# that failed lint, typecheck, or tests.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push to ghcr.io → Render
    runs-on: ubuntu-latest

    # Only deploy when CI was green.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      # Checkout at the exact commit that triggered CI, not the current HEAD of
      # main (they can differ if another push landed since CI started).
      - name: Checkout (at triggering commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provisioned per-job — no secret needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces two tags:
      #   ghcr.io/OWNER/REPO:latest
      #   ghcr.io/OWNER/REPO:sha-<short-sha>
      # The sha tag lets you pin a Render deploy to an exact commit if needed.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache keeps layer cache across runs.
          # First build: cold (1-3 min). Subsequent builds with unchanged deps:
          # warm (<30 s because the pip layer is cached).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render doesn't poll ghcr.io automatically for new :latest tags —
      # it needs an explicit trigger via the deploy hook URL.
      # Set RENDER_DEPLOY_HOOK_URL in GitHub → Settings → Secrets → Actions.
      # If the secret is absent the step is skipped gracefully (dev forks).
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Render deploy..."
          curl -f -s -X POST "$RENDER_DEPLOY_HOOK_URL" \
            --retry 3 \
            --retry-delay 5 \
            -w "\nHTTP status: %{http_code}\n"
          echo "Render deploy triggered. Track progress at https://dashboard.render.com"
